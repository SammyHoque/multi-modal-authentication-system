<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <section class="left-panel">
      <div class="left-content">
        <h1>Don’t have an account?</h1>
        <p>Click below to create one.</p>
        <a href="index.html" class="switch-btn">Sign Up</a>
      </div>
    </section>

    <section class="right-panel">
      <div class="form-box">
        <form id="signinForm">
            <h2>Welcome Back</h2>
            <p class="form-subtitle">Enter your details, then continue to graphical authentication.</p>
          <label for="signinUsername">Username</label>
          <input type="text" id="signinUsername" required />

          <label for="signinEmail">Email address</label>
          <input type="email" id="signinEmail" required />

          <button type="submit" class="primary-btn">Sign In</button>
        </form>
      </div>
    </section>
  </div>

  <script type="module" src="../js/pages/signin.js"></script>
</body>
</html>
